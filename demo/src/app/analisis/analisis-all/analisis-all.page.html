<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Analisis de Ventas</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Analisis de Ventas</ion-title>
    </ion-toolbar>
  </ion-header>

  <!-- Lista de Ventas (Gráfico de líneas) -->
  <ion-card>
    <ion-card-header>
      <ion-card-title>Lista de Ventas</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <div style="width: 100%; height: 300px;">
        <canvas id="ventasGrafico"></canvas>
      </div>
    </ion-card-content>
  </ion-card>

  <!-- Temporada de Ventas (Gráfico de barras) -->
  <ion-card>
    <ion-card-header>
      <ion-card-title>Temporada de Ventas</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <div style="width: 100%; height: 300px;">
        <canvas id="temporadaVentasGrafico"></canvas>
      </div>
    </ion-card-content>
  </ion-card>

  <!-- Tallas Más Vendidas (Gráfico de pie) -->
  <ion-card>
    <ion-card-header>
      <ion-card-title>Tallas Más Vendidas</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <div style="width: 100%; height: 300px;">
        <canvas id="tallasVendidasGrafico"></canvas>
      </div>
    </ion-card-content>
  </ion-card>

  <!-- Colores Más Vendidos (Gráfico de radar) -->
  <ion-card>
    <ion-card-header>
      <ion-card-title>Colores Más Vendidos</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <div style="width: 100%; height: 300px;">
        <canvas id="coloresVendidosGrafico"></canvas>
      </div>
    </ion-card-content>
  </ion-card>
</ion-content>
