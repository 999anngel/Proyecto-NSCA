<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-img src="../assets/img/logo-negro.png" alt="logo" style="height: 50%; width: 50%;"></ion-img>
  </ion-toolbar>
</ion-header>

<ion-content *ngIf="empleado">
  <ion-card>
    <ion-card-header>
      <ion-card-title>Perfil de Empleado</ion-card-title>
    </ion-card-header>

    <ion-card-content>
      <ion-list>
        <ion-item>
          <ion-label position="stacked">Nombre</ion-label>
          <ion-input [value]="empleado.nombre" readonly></ion-input>
        </ion-item>
        <ion-item>
          <ion-label position="stacked">Cargo</ion-label>
          <ion-input [value]="empleado.cargo" readonly></ion-input>
        </ion-item>
        <ion-item>
          <ion-label position="stacked">Departamento</ion-label>
          <ion-input [value]="empleado.departamento" readonly></ion-input>
        </ion-item>
        <ion-item>
          <ion-label position="stacked">Correo Electronico</ion-label>
          <ion-input [value]="empleado.email" readonly></ion-input>
        </ion-item>
        <ion-item>
          <ion-label position="stacked">Contraseña</ion-label>
          <ion-input type="password" [value]="empleado.password" readonly></ion-input>
        </ion-item>
        <ion-item>
          <ion-label position="stacked">Número</ion-label>
          <ion-input [value]="empleado.telefono" readonly></ion-input>
        </ion-item>
      </ion-list>
    </ion-card-content>
  </ion-card>

  <ion-list>
    <ion-item>
      <ion-icon slot="start" name="settings-outline"></ion-icon>
      <ion-label>Configuración de la cuenta</ion-label>
    </ion-item>
    <ion-item (click)="deleteSession(1)">
      <ion-icon slot="start" name="log-out-outline"></ion-icon>
      <ion-label>Cerrar sesión</ion-label>
    </ion-item>
  </ion-list>
</ion-content>

<ion-footer>
  <ion-toolbar>
    <ion-buttons slot="start">
      <!-- Espacio reservado al inicio si es necesario -->
    </ion-buttons>

    <ion-buttons slot="end" class="footer-buttons">
      <ion-button fill="clear" [routerLink]="['/admin', empleado?.id]">
        <ion-icon class="icons-color" name="home-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-footer>
