<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title> Nuevo Producto </ion-title>
    <ion-buttons slot="end">
      <ion-back-button defaultHref="/"></ion-back-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content padding>
  <form [formGroup]="productForm" (ngSubmit)="onFormSubmit()">
    <ion-item>
      <ion-label position="floating">Nombre</ion-label>
      <ion-input type="text" [(ngModel)]="producto.nombre" formControlName="prod_name"></ion-input>
    </ion-item>
    <ion-item>
      <ion-label position="floating">Precio</ion-label>
      <ion-input type="number" [(ngModel)]="producto.precio" formControlName="prod_price"></ion-input>
    </ion-item>
    <ion-item>
      <ion-label position="floating">Descripción</ion-label>
      <ion-textarea [(ngModel)]="producto.descripcion" formControlName="prod_desc"></ion-textarea>
    </ion-item>
    <ion-item>
      <ion-label position="floating">Stock</ion-label>
      <ion-input type="number" [(ngModel)]="producto.stock" formControlName="prod_stock"></ion-input>
    </ion-item>
    <ion-item>
      <ion-label position="floating">Categoría</ion-label>
      <ion-input type="text" [(ngModel)]="producto.categoria" formControlName="prod_categoria"></ion-input>
    </ion-item>
    <ion-item>
      <ion-label position="floating">Género</ion-label>
      <ion-input type="text" [(ngModel)]="producto.genero" formControlName="prod_genero"></ion-input>
    </ion-item>
    <ion-item>
      <ion-label position="floating">Color</ion-label>
      <ion-input type="text" [(ngModel)]="producto.color" formControlName="prod_color"></ion-input>
    </ion-item>
    <ion-item>
      <ion-label position="floating">Imagen 1</ion-label>
      <ion-input type="text" [(ngModel)]="producto.img1" formControlName="prod_img1"></ion-input>
    </ion-item>
    <ion-item>
      <ion-label position="floating">Imagen 2</ion-label>
      <ion-input type="text" [(ngModel)]="producto.img2" formControlName="prod_img2"></ion-input>
    </ion-item>
    <ion-item>
      <ion-label position="floating">Imagen 3</ion-label>
      <ion-input type="text" [(ngModel)]="producto.img3" formControlName="prod_img3"></ion-input>
    </ion-item>
    <ion-item>
      <ion-label position="floating">Imagen 4</ion-label>
      <ion-input type="text" [(ngModel)]="producto.img4" formControlName="prod_img4"></ion-input>
    </ion-item>
    <ion-button type="submit" shape="round" color="primary" expand="block" [disabled]="!productForm.valid">Submit</ion-button>
  </form>
</ion-content>
